<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Asturien</title>
		
		<!-- CSS -->
		<link rel="stylesheet" href="Styles.css" />

		<!-- jQuery -->
		<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
		  
		<!-- js --> 
		<script src="Script.js"></script>
	</head>
	<body>
	

		
		<div id="main-content">

			<div class="button-list">
				<button id="centerButton">Bild zentrieren</button>
				<button id="questButton">Quests öffnen</button>
				<button id="mapButton">Maps anzeigen</button>
			</div>

			<!-- Image map wrapper -->
			<div id="map-wrapper">



				<picture>
					<source srcset="https://d3i7ftxev28jeb.cloudfront.net/Webseite_v2.avif" type="image/avif">
					<source srcset="https://d3i7ftxev28jeb.cloudfront.net/Webseite_v2.webp" type="image/webp">
					<img src="https://d3i7ftxev28jeb.cloudfront.net/Webseite_v2.png" type="image/png"/>	
				</picture>	
				
				<!-- Clickable hotspots -->
				<div class="hotspots">
					<div class="valblanc-click" 		data-target="Cities/Valblanc.html"></div>
					<div class="fleuret-click" 			data-target="Cities/Fleuret.html"></div>
					<div class="dreibach-click" 		data-target="Cities/Dreibach.html"></div>
					<div class="fortresse-click" 		data-target="Cities/Fortresse_DAmbere.html"></div>
					<div class="grenzwacht-click"	 	data-target="Cities/Grenzwacht.html"></div>
					<div class="hautville-click" 		data-target="Cities/Hautville.html"></div>
					<div class="blutsumpf-click" 		data-target="Cities/Lager_Blutsumpf.html"></div>
					<div class="steinhof-click" 		data-target="Cities/Steinhof.html"></div>

					<div class="rocherdragon-click" 	data-target="Cities/Rocherdragon.html"></div>
					<div class="couronneax-click" 		data-target="Cities/Couronneax.html"></div>
					<div class="verdaille-click" 		data-target="Cities/Verdaille.html"></div>
					<div class="chateupierre-click" 	data-target="Cities/Chateupierre.html"></div>
					<div class="boisdemorts-click" 		data-target="Cities/Boisdemorts.html"></div>
					<div class="bärental-click" 		data-target="Cities/Baerental.html"></div>
					<div class="forstthal-click" 		data-target="Cities/Forstthal.html"></div>
					<div class="sturmfeld-click" 		data-target="Cities/Sturmfeld.html"></div>
					<div class="wolkenschloss-click" 	data-target="Cities/Wolkenschloss.html"></div>
					<div class="eichenhain-click" 		data-target="Cities/Eichenhain.html"></div>
				</div>
			</div>
		</div>

		<!-- Iframe to show dynamic content -->
		<div id="City-info-container">
			<iframe id="info-frame"></iframe>        
		</div>
		<div id="Quest-info-container">
			<iframe id="quest-frame"></iframe>        
		</div>
		<div id="Map-info-container">
			<iframe id="map-frame"></iframe>        
		</div>
	</body>
</html>

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8"/>
		<title>Quest</title>
		
		<!-- CSS -->
		<link rel="stylesheet" href="Quest_Style.css"/>
		
		<!-- jQuery -->
		<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
		  
		<!-- js --> 
		<script src="Quest_Script.js"></script>
	</head>
	<body>
		<button id="close-btn">Close</button>


		<div class="form-container">
			<div class="form-row">
				<div class="form-group small">
					<label for="Quest-name">Quest Name</label>
					<input id="Quest-name" name="Quest-name" type="text" placeholder="Name der Quest">
				</div>
				<div class="form-group">
					<label for="Quest-description">Quest Beschreibung</label>
					<textarea  id="Quest-description" name="Quest-description" rows="4" placeholder="Beschreibung der Quest"></textarea>
				</div>
			</div>

				<button id="Save-button" type="button" onclick="save()">Speichern</button>
				<button id="Load-button" type="button" onclick="load()">Laden</button>

				<table id="datenTabelle">
					<thead>
						<tr>
							<th>Quest Name</th>
							<th>Quest Beschreibung</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
		</div>



	</body>
</html>
